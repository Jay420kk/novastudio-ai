name: generate_image
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Image prompt
        required: true
        type: string
      negative:
        description: Negative prompt
        required: false
        default: ''
        type: string
      width:
        description: Image width
        required: false
        default: '512'
        type: string
      height:
        description: Image height
        required: false
        default: '768'
        type: string
      steps:
        description: Inference steps
        required: false
        default: '30'
        type: string
      seed:
        description: Random seed (-1 for random)
        required: false
        default: '-1'
        type: string
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: sd-image-v1

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-image-v1

      - name: Install dependencies
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet diffusers transformers accelerate safetensors pillow

      - name: Generate image
        run: |
          mkdir -p out
          python tools/image_generate_cli.py \
            --prompt "${{ inputs.prompt }}" \
            --negative "${{ inputs.negative }}" \
            --width "${{ inputs.width }}" \
            --height "${{ inputs.height }}" \
            --steps "${{ inputs.steps }}" \
            --seed "${{ inputs.seed }}" \
            -o out/image.png

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: generated
          path: out/
          retention-days: 7
