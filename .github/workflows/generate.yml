name: generate
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Music description
        required: true
        type: string
      seconds:
        description: Length in seconds
        required: false
        default: '8'
        type: string
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache MusicGen model (10GB free Actions cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: musicgen-small-v1

      - name: Install dependencies
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers soundfile

      - name: Generate music
        run: python tools/generate_cli.py "${{ inputs.prompt }}" "${{ inputs.seconds }}"

      - name: Upload WAV
        uses: actions/upload-artifact@v4
        with:
          name: generated
          path: generated.wav
          retention-days: 7
