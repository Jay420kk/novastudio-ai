name: generate
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Music description
        required: true
        type: string
      seconds:
        description: Length in seconds
        required: false
        default: '8'
        type: string
      mode:
        description: mix (one WAV) or beat (full mix + demucs stems)
        required: false
        default: 'mix'
        type: string
      model:
        description: 'small, medium, or stereo-medium (default: auto per mode)'
        required: false
        default: 'auto'
        type: string
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve model
        id: model
        env:
          MODEL_INPUT: ${{ inputs.model }}
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          # explicit model input wins; else beat needs memory for demucs -> small,
          # mix can use medium (higher quality)
          if [ -n "$MODEL_INPUT" ] && [ "$MODEL_INPUT" != "auto" ]; then
            echo "model=$MODEL_INPUT" >> "$GITHUB_OUTPUT"
          elif [ "$MODE_INPUT" = "beat" ]; then
            echo "model=small" >> "$GITHUB_OUTPUT"
          else
            echo "model=medium" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache MusicGen + demucs models (10GB free Actions cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: musicgen-${{ steps.model.outputs.model }}-v2

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('tools/*.py') }}

      - name: Install dependencies
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers soundfile demucs

      - name: Generate music
        env:
          PROMPT: ${{ inputs.prompt }}
          SECONDS_INPUT: ${{ inputs.seconds }}
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p out
          python tools/generate_cli.py "$PROMPT" "$SECONDS_INPUT" --mode "$MODE" --model "${{ steps.model.outputs.model }}" -o out/generated.wav

      - name: Upload WAVs
        uses: actions/upload-artifact@v4
        with:
          name: generated
          path: out/
          retention-days: 7
